name: CI

on:
  # PRs (incl. Dependabot) are tested via pull_request; pushes only on master,
  # so each change runs once instead of twice.
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so new advisories in dependencies show up even without commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-24.04
    services:
      # Real Postgres for the migration tests (tests/legacy.rs).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      LEGACY_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Audit dependencies (RustSec)
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          cargo audit --deny warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: server-bin
          path: server/target/release/federico-server
          retention-days: 3

  web:
    name: Frontend (typecheck, audit, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 3

  e2e:
    name: End-to-end (browser)
    needs: [rust, web]
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: http://localhost:8081
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASS: ci-e2e-admin-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: server-bin
          path: bin
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: out
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          chmod +x bin/federico-server
          # Google's public reCAPTCHA test secret: accepts any token.
          PORT=8081 BIND_HOST=127.0.0.1 ALLOWED_ORIGIN=$E2E_BASE_URL COOKIE_SECURE=false \
          DATABASE_PATH=$RUNNER_TEMP/e2e.db STATIC_DIR=./out \
          RECAPTCHA_SECRET=6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe \
          SYS_ADMIN_USERNAME=$E2E_ADMIN_USER SYS_ADMIN_PASSWORD=$E2E_ADMIN_PASS \
          ./bin/federico-server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf $E2E_BASE_URL/healthz && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npx playwright test
      - if: failure()
        run: cat server.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t federico:ci .
